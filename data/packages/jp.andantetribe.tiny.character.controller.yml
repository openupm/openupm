name: jp.andantetribe.tiny.character.controller
aliases: []
displayName: Tiny Character Controller
description: >-
  This package is a toolkit designed to provide flexible and powerful support
  for character control in games. 

  It consists of four main components: coordinate updates, movement through user
  input, movement triggered by external factors,
   and sensors for determining movement. Visual Scripting integration is optional.
