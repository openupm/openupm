name: com.manefunction.sound-maneger
aliases: []
displayName: Sound Maneger
description: >-
  Just a neat sound manager for Unity: separate music and SFX channels,
  crossfaded playlists, ducking, and async clip loading from Resources or
  Addressables.


  Drop the 'SoundManeger' prefab into your first scene, add it with 'GameObject
  -> Add SoundManeger', or find the component in 'Add Component -> Mane Tools ->
  Audio -> Sound Maneger'.
