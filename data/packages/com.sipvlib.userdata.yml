name: com.sipvlib.userdata
aliases: []
displayName: SiPVLib UserData
description: >-
  A player save-data layer behind one facade (UserDataManager), persisted
  through pluggable IStorageProviders (PlayerPrefs/LocalFile/Firestore), with
  versioned schemas, automatic migration, opt-in write batching for hot-path
  counters, and an optional Odin Inspector-powered editor window for
  inspecting/editing saved data.
