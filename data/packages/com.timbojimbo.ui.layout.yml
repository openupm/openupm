displayName: UI Layout
description: >-
  Layout and motion for UGUI in one system, modelled on Clay: a layout pass that
  says where every node goes, and nodes that get there with velocity, on
  springs. Wrapping and grids, the safe area, show and hide effects, matched
  names that fly between places, and scrolling with nested drags, paging and
  indicators.
