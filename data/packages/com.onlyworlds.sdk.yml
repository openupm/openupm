name: com.onlyworlds.sdk
aliases: []
displayName: OnlyWorlds SDK
description: >-
  A Unity SDK for OnlyWorlds, an open worldbuilding standard: a world's
  characters, locations and laws as objects in your game. Reads and writes
  worlds through the OnlyWorlds API and as world folders on disk, with typed C#
  models for all 22 element types and a world cache you can browse in the
  Editor.
